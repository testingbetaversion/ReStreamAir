name: Build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

env:
  SWIFT_IMAGE: swift:6.1.2
  STATIC_SDK_URL: https://download.swift.org/swift-6.1.2-release/static-sdk/swift-6.1.2-RELEASE/swift-6.1.2-RELEASE_static-linux-0.0.1.artifactbundle.tar.gz
  STATIC_SDK_SHA: df0b40b9b582598e7e3d70c82ab503fd6fbfdff71fd17e7f1ab37115a0665b3b

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      # Every .swift source except the menu-bar companion and the Package.swift
      # manifest (which isn't a compilable source).
      - name: Build restreamair
        run: swiftc $(ls *.swift | grep -vE 'MenuBarApp.swift|Package.swift') -o restreamair
      - name: Build restreamair-menubar
        run: swiftc HTTPClient.swift MenuBarApp.swift -o restreamair-menubar -framework AppKit
      - name: Smoke test
        run: ./restreamair dash --help
      - name: Crypto self-test
        run: ./restreamair selftest
      - uses: actions/upload-artifact@v4
        with:
          name: restreamair-macos
          path: |
            restreamair
            restreamair-menubar
          if-no-files-found: error

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Fully static via the musl Static Linux SDK + embedded web UI → ONE file
      # with zero external deps (no Swift runtime, libcurl, libxml2, or glibc).
      - name: Build restreamair (Linux x86-64, fully static + embedded UI)
        run: |
          docker run --rm -e STATIC_SDK_URL -e STATIC_SDK_SHA -v "$PWD:/src" -w /src "$SWIFT_IMAGE" bash -c '
            set -e
            swift sdk install "$STATIC_SDK_URL" --checksum "$STATIC_SDK_SHA"
            sh scripts/embed-assets.sh
            swift build -c release --swift-sdk x86_64-swift-linux-musl --product restreamair
            cp .build/x86_64-swift-linux-musl/release/restreamair restreamair-linux
          '
          file restreamair-linux
      # Gold standard: run on a bare ubuntu:24.04 with NOTHING installed.
      - name: Runs on bare Ubuntu with zero dependencies
        run: |
          docker run --rm -v "$PWD:/w" -w /w ubuntu:24.04 bash -c '
            echo "--- ldd (expect: not a dynamic executable) ---"; ldd restreamair-linux || true
            ./restreamair-linux selftest
            ./restreamair-linux serve --port 8799 --bind 127.0.0.1 &
            sleep 4
            root=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8799/); echo "web UI: HTTP $root"; test "$root" = "200"
            js=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8799/app.js); echo "app.js: HTTP $js"; test "$js" = "200"
            echo "single-file binary serves the embedded UI on bare Ubuntu: OK"
          '
      - uses: actions/upload-artifact@v4
        with:
          name: restreamair-linux
          path: restreamair-linux
          if-no-files-found: error

  # Dynamically-linked glibc build (static Swift runtime, system libcurl+libxml
  # resolved at runtime). Unlike the fully-static musl single file, this uses
  # the host's OpenSSL/libcurl, so it trusts the system CA store and can fetch
  # HTTPS manifests. The musl single file bundles BoringSSL, which ships with no
  # default trust store and no runtime CA override — it serves the embedded UI
  # but cannot pull upstream streams — so this glibc build is the deployable
  # Linux server binary until the musl TLS trust gap is closed.
  build-linux-glibc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build (glibc, static Swift runtime)
        run: |
          docker run --rm -v "$PWD:/src" -w /src swift:6.0 \
            bash -c 'swiftc -O -static-stdlib $(ls *.swift | grep -vE "MenuBarApp.swift|Package.swift") -o restreamair-linux-glibc'
          file restreamair-linux-glibc
      - name: Self-contained-ish check + crypto self-test
        run: |
          if ldd restreamair-linux-glibc | grep -qi swift; then echo "ERROR: links Swift runtime"; exit 1; fi
          ./restreamair-linux-glibc selftest
      - name: Outbound HTTPS works (trusts system CAs)
        run: |
          ./restreamair-linux-glibc dash --info https://livesim2.dashif.org/livesim2/testpic_2s/Manifest.mpd | head -3
      - uses: actions/upload-artifact@v4
        with:
          name: restreamair-linux-glibc
          path: restreamair-linux-glibc
          if-no-files-found: error

  build-linux-arm64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      # The static SDK cross-compiles arm64 from the x86 runner (fast — no
      # emulation to build); QEMU is only used to run the result for the test.
      - name: Build restreamair (Linux arm64, fully static + embedded UI)
        run: |
          docker run --rm -e STATIC_SDK_URL -e STATIC_SDK_SHA -v "$PWD:/src" -w /src "$SWIFT_IMAGE" bash -c '
            set -e
            swift sdk install "$STATIC_SDK_URL" --checksum "$STATIC_SDK_SHA"
            sh scripts/embed-assets.sh
            swift build -c release --swift-sdk aarch64-swift-linux-musl --product restreamair
            cp .build/aarch64-swift-linux-musl/release/restreamair restreamair-linux-arm64
          '
          file restreamair-linux-arm64
      - name: Runs on bare arm64 Ubuntu with zero dependencies
        run: |
          docker run --rm --platform linux/arm64 -v "$PWD:/w" -w /w ubuntu:24.04 bash -c '
            ldd restreamair-linux-arm64 || true
            ./restreamair-linux-arm64 selftest
            echo "single-file arm64 binary runs on bare Ubuntu: OK"
          '
      - uses: actions/upload-artifact@v4
        with:
          name: restreamair-linux-arm64
          path: restreamair-linux-arm64
          if-no-files-found: error
