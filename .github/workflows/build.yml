name: Build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Swift version
        run: swift --version

      # Every .swift source except the optional macOS menu-bar companion
      # (its own @main / AppKit) — same command the README documents.
      - name: Build restreamair
        run: swiftc $(ls *.swift | grep -v MenuBarApp.swift) -o restreamair

      - name: Build restreamair-menubar
        run: swiftc HTTPClient.swift MenuBarApp.swift -o restreamair-menubar -framework AppKit

      - name: Smoke test
        run: ./restreamair dash --help

      - name: Crypto self-test
        run: ./restreamair selftest

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: restreamair-macos
          path: |
            restreamair
            restreamair-menubar
          if-no-files-found: error

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Fully static (musl Static Linux SDK) + embedded web assets → one file
      # with NO external dependencies: no Swift runtime, no libcurl, no libxml2,
      # no glibc. Runs on literally any x86-64 Linux.
      - name: Build restreamair (Linux, fully static + embedded UI)
        run: |
          docker run --rm -v "$PWD:/src" -w /src swift:6.0.0 bash -c '
            set -e
            swift sdk install \
              https://download.swift.org/swift-6.0-release/static-sdk/swift-6.0-RELEASE/swift-6.0-RELEASE_static-linux-0.0.1.artifactbundle.tar.gz \
              --checksum 7984c2cf175bde52ba6ea1fcbe27fc4a148a6237c41c719209c9288ed3ceb652
            sh scripts/embed-assets.sh
            swift build -c release --swift-sdk x86_64-swift-linux-musl --product restreamair
            cp .build/x86_64-swift-linux-musl/release/restreamair restreamair-linux
          '
          file restreamair-linux

      # The gold standard: run it on a bare ubuntu:24.04 with NOTHING added —
      # no Swift, no libcurl, no libxml2 — and serve the embedded web UI.
      - name: Runs on a bare Ubuntu with zero dependencies
        run: |
          docker run --rm -v "$PWD:/w" -w /w ubuntu:24.04 bash -c '
            echo "--- ldd (expect: not a dynamic executable) ---"; ldd restreamair-linux || true
            ./restreamair-linux selftest
            ./restreamair-linux serve --port 8799 --bind 127.0.0.1 &
            sleep 4
            root=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8799/)
            echo "web UI root: HTTP $root"; test "$root" = "200"
            js=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8799/app.js)
            echo "app.js: HTTP $js"; test "$js" = "200"
            echo "single-file binary serves the embedded UI on a bare Ubuntu: OK"
          '

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: restreamair-linux
          path: restreamair-linux
          if-no-files-found: error

  build-linux-arm64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3

      - name: Build restreamair (Linux arm64, static)
        run: |
          docker run --rm --platform linux/arm64 -v "$PWD:/src" -w /src swift:6.0 \
            bash -c 'swiftc -O -static-stdlib $(ls *.swift | grep -v MenuBarApp.swift) -o restreamair-linux-arm64'
          file restreamair-linux-arm64

      # Prove it runs on a bare arm64 Ubuntu (no Swift, only libcurl4 + libxml2).
      - name: Self-contained on bare arm64 Ubuntu (no Swift)
        run: |
          docker run --rm --platform linux/arm64 -v "$PWD:/w" -w /w ubuntu:24.04 bash -c '
            apt-get update -qq && apt-get install -y -qq libcurl4 libxml2 >/dev/null
            if ldd restreamair-linux-arm64 | grep -qi swift; then echo "ERROR: links the Swift runtime"; exit 1; fi
            ./restreamair-linux-arm64 selftest
            echo "runs on bare arm64 Ubuntu: OK"
          '
