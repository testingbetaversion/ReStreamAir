name: Build

on:
  # Auto-build on every push to main is DISABLED to save Actions minutes —
  # re-enable by uncommenting the push block below. PRs and manual runs still
  # build.
  # push:
  #   branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  # The one build there is: the C core, the self-test and the panel executable,
  # on every platform the tree claims to support.
  core:
    name: C core (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install libcurl + libxml2 (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev libxml2-dev
      - name: Install libxml2 (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install libxml2 pkg-config
          echo "PKG_CONFIG_PATH=$(brew --prefix libxml2)/lib/pkgconfig" >> "$GITHUB_ENV"
      # Windows has no libcurl/libxml2 without vcpkg, so it builds the core and
      # the self-test only — which is the part that has to be right everywhere.
      - name: Configure
        shell: bash
        run: cmake -S . -B build ${{ runner.os == 'Windows' && '-DRS_BUILD_SERVER=OFF' || '' }}
      - name: Build
        run: cmake --build build --config Release
      - name: Self-test (NIST vectors + module goldens)
        run: ctest --test-dir build -C Release --output-on-failure
      # The HTTP layer the self-test cannot reach: the auth gate, the viewer
      # role, the login throttle, session persistence across a restart, cookie
      # attributes and the mode of state.json.
      - name: API end-to-end
        if: runner.os != 'Windows'
        run: python3 scripts/api-smoke.py --binary build/restreamair-server
      - name: Smoke test the panel binary
        if: runner.os != 'Windows'
        run: |
          ./build/restreamair-server --port 8799 --bind 127.0.0.1 --root public &
          sleep 3
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8799/)" = "200"
          curl -fsS http://127.0.0.1:8799/ping

  # ASan + UBSan over the same suites. The core parses attacker-supplied bytes
  # (MPD XML, MP4 boxes, playlists), which is exactly where a memory bug becomes
  # a security bug.
  core-sanitizers:
    name: C core (sanitizers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev libxml2-dev
      - name: Configure with ASan + UBSan
        run: cmake -S . -B build-asan -DRS_SANITIZE=ON -DCMAKE_BUILD_TYPE=Debug
      - name: Build
        run: cmake --build build-asan
      - name: Self-test under sanitizers
        env:
          ASAN_OPTIONS: abort_on_error=1:detect_leaks=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --test-dir build-asan --output-on-failure
      - name: API end-to-end under sanitizers
        env:
          # The server is killed by the harness rather than shut down cleanly,
          # so at-exit leak reporting would flag the live state it still owns.
          # Use-after-free and overflow detection — the bugs that matter — are
          # unaffected.
          ASAN_OPTIONS: abort_on_error=1:detect_leaks=0
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: python3 scripts/api-smoke.py --binary build-asan/restreamair-server
