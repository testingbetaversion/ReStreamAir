name: Release

on:
  push:
    tags: [ 'v*' ]
    # Nightly releases on every push to main are DISABLED to save Actions
    # minutes — re-enable by uncommenting the line below. Tag pushes (v*) and
    # manual runs (workflow_dispatch) still cut a release.
    # branches: [ 'main' ]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag to release, e.g. v1.0.0'
        required: true

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve version
        id: ver
        run: |
          TAG="${{ github.event.inputs.tag }}"; [ -z "$TAG" ] && TAG="${GITHUB_REF_NAME}"
          if [ "$TAG" = "main" ]; then TAG="nightly"; fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
      - name: Stamp version
        run: |
          sed -i '' "s/static let version = \"dev\"/static let version = \"${{ steps.ver.outputs.version }}\"/" Version.swift
          sed -i '' "s/static let commit = \"unknown\"/static let commit = \"${GITHUB_SHA:0:7}\"/" Version.swift
      - name: Embed web UI
        run: sh scripts/embed-assets.sh
      # SwiftPM, not a bare swiftc: the Swift sources import restream_core, and
      # only SwiftPM compiles and links the C core alongside them.
      - run: swift build -c release --product restreamair && cp .build/release/restreamair restreamair
      - run: swiftc -O HTTPClient.swift MenuBarApp.swift -o restreamair-menubar -framework AppKit
      - run: tar -czf restreamair-${{ steps.ver.outputs.tag }}-macos.tar.gz restreamair restreamair-menubar
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            restreamair
            restreamair-menubar
            restreamair-${{ steps.ver.outputs.tag }}-macos.tar.gz

  build-linux:
    runs-on: ubuntu-latest
    env:
      SWIFT_IMAGE: swift:6.0.3
      STATIC_SDK_URL: https://download.swift.org/swift-6.0.3-release/static-sdk/swift-6.0.3-RELEASE/swift-6.0.3-RELEASE_static-linux-0.0.1.artifactbundle.tar.gz
      STATIC_SDK_SHA: 67f765e0030e661a7450f7e4877cfe008db4f57f177d5a08a6e26fd661cdd0bd
    steps:
      - uses: actions/checkout@v4
      - name: Resolve version
        id: ver
        run: |
          TAG="${{ github.event.inputs.tag }}"; [ -z "$TAG" ] && TAG="${GITHUB_REF_NAME}"
          if [ "$TAG" = "main" ]; then TAG="nightly"; fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
      - name: Stamp version
        run: |
          COMMIT=$(echo "$GITHUB_SHA" | cut -c1-7)
          sed -i "s/static let version = \"dev\"/static let version = \"${{ steps.ver.outputs.version }}\"/" Version.swift
          sed -i "s/static let commit = \"unknown\"/static let commit = \"$COMMIT\"/" Version.swift
      # glibc + static Swift runtime → dynamically links system libcurl+OpenSSL
      # (so it trusts the host CA store and can fetch HTTPS, unlike a fully-static
      # musl build) while needing no Swift toolchain. Web UI is embedded, so the
      # binary needs no public/ directory on disk. We then bundle the versioned
      # libs (libxml2/ICU/lzma) whose sonames drift across Ubuntu releases, plus
      # a launcher, so a bare download runs on newer distros (e.g. 26.04 ships
      # libxml2.so.16, not the .so.2 the binary links) without installing anything.
      - name: Build + bundle self-contained tarball (embedded UI + libs + launcher)
        run: |
          STAGE="restreamair-${{ steps.ver.outputs.tag }}-linux-x86_64"
          docker run --rm -v "$PWD:/src" -w /src swift:6.0 bash -c "
            set -e
            sh scripts/embed-assets.sh
            swift build -c release --product restreamair -Xswiftc -static-stdlib
            cp .build/release/restreamair restreamair-linux
            sh scripts/bundle-linux.sh '$STAGE'
          "
          file restreamair-linux
          tar -czf "$STAGE.tar.gz" "$STAGE"
          echo "STAGE=$STAGE" >> "$GITHUB_ENV"
      - name: Verify no Swift runtime linked
        run: |
          if ldd restreamair-linux | grep -qi swift; then echo "links Swift runtime unexpectedly"; exit 1; fi
      - name: Verify the bundle runs on a host WITHOUT libxml2/ICU (the 26.04 failure mode)
        run: |
          docker run --rm -v "$PWD/$STAGE:/app:ro" ubuntu:24.04 bash -c '
            set -e
            # A real server has libcurl+OpenSSL (standard); the binary uses the
            # system copy so it trusts the host CA store. Install it first...
            apt-get update -qq && apt-get install -y -qq libcurl4 ca-certificates >/dev/null
            # ...then simulate a NEWER distro whose libxml2/ICU/lzma sonames
            # differ (Ubuntu 26.04 ships libxml2.so.16) by removing them, so the
            # ONLY way the binary loads those is via the bundled libs/.
            find / \( -name "libxml2.so.*" -o -name "libicu*.so.*" -o -name "liblzma.so.*" \) -delete 2>/dev/null || true
            echo "--- bare binary should FAIL to load libs ---"
            /app/restreamair-linux selftest 2>&1 | head -1 || echo "(bare binary failed, as expected)"
            echo "--- launcher should SUCCEED using bundled libs ---"
            /app/restreamair selftest
            /app/restreamair dash --info https://livesim2.dashif.org/livesim2/testpic_2s/Manifest.mpd | head -2
          '
      - name: Build restreamair (Linux x86-64, fully static musl + embedded UI)
        run: |
          docker run --rm -e STATIC_SDK_URL -e STATIC_SDK_SHA -v "$PWD:/src" -w /src "$SWIFT_IMAGE" bash -c '
            set -e
            swift sdk install "$STATIC_SDK_URL" --checksum "$STATIC_SDK_SHA"
            swift build -c release --swift-sdk x86_64-swift-linux-musl --product restreamair
            cp .build/x86_64-swift-linux-musl/release/restreamair restreamair-linux-static
          '
          file restreamair-linux-static
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            restreamair-linux
            restreamair-linux-static
            restreamair-${{ steps.ver.outputs.tag }}-linux-x86_64.tar.gz

