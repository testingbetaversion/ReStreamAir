  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve version
        id: ver
        run: |
          $TAG = "${{ github.event.inputs.tag }}"
          if ([string]::IsNullOrWhiteSpace($TAG)) { $TAG = $env:GITHUB_REF_NAME }
          if ($TAG -eq "main") { $TAG = "nightly" }
          "tag=$TAG" >> $env:GITHUB_OUTPUT
          "version=$($TAG.TrimStart('v'))" >> $env:GITHUB_OUTPUT
      - name: Stamp version
        run: |
          $COMMIT = $env:GITHUB_SHA.Substring(0, 7)
          (Get-Content Version.swift) -replace 'static let version = "dev"', "static let version = `"${{ steps.ver.outputs.version }}`"" -replace 'static let commit = "unknown"', "static let commit = `"$COMMIT`"" | Set-Content Version.swift
      # 6.1.2 fixes the "cyclic dependency in module 'ucrt'" Swift 6.0 hit on the
      # MSVC that windows-latest now ships.
      - uses: compnerd/gha-setup-swift@main
        with:
          swift-version: "swift-6.1.2-release"
          swift-build: "6.1.2-RELEASE"
      - name: Build restreamair (Windows x64)
        shell: pwsh
        run: |
          $STAGE = "restreamair-${{ steps.ver.outputs.tag }}-windows-x64"
          # SwiftPM, not a bare swiftc: the sources import restream_core.
          swift build -c release --product restreamair
          Copy-Item .build\release\restreamair.exe -Destination restreamair.exe
          New-Item -ItemType Directory -Path $STAGE -Force
          Copy-Item restreamair.exe -Destination "$STAGE\restreamair.exe"
          $swiftBin = Split-Path (Get-Command swiftc).Path
          $swiftParent = Split-Path (Split-Path (Split-Path (Split-Path $swiftBin -Parent) -Parent) -Parent)
          $searchPaths = @($swiftBin, $swiftParent, "$env:LOCALAPPDATA\Programs\Swift", "C:\Users\runneradmin\AppData\Local\Programs\Swift") | Where-Object { $_ -and (Test-Path $_) }
          Get-ChildItem -Path $searchPaths -Recurse -Filter "*.dll" -ErrorAction SilentlyContinue | ForEach-Object {
              Copy-Item $_.FullName -Destination "$STAGE\" -Force
          }
          Compress-Archive -Path "$STAGE" -DestinationPath "$STAGE.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            restreamair.exe
            restreamair-${{ steps.ver.outputs.tag }}-windows-x64.zip

  release:
    needs: [build-macos, build-linux, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Resolve tag
        id: ver
        run: |
          TAG="${{ github.event.inputs.tag }}"; [ -z "$TAG" ] && TAG="${GITHUB_REF_NAME}"
          if [ "$TAG" = "main" ]; then TAG="nightly"; fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with: { path: dist }
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ver.outputs.tag == 'nightly' && 'Nightly Build' || steps.ver.outputs.tag }}
          generate_release_notes: true
          prerelease: ${{ steps.ver.outputs.tag == 'nightly' }}
          files: dist/**/*
