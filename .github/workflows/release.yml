name: Release

on:
  push:
    tags: [ 'v*' ]
    # Nightly releases on every push to main are DISABLED to save Actions
    # minutes — re-enable by uncommenting the line below. Tag pushes (v*) and
    # manual runs (workflow_dispatch) still cut a release.
    # branches: [ 'main' ]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag to release, e.g. v1.0.0'
        required: true

permissions:
  contents: write

# Every artifact is the same executable plus the public/ directory it serves.
# The panel resolves public/ relative to its working directory (or --root), so a
# release is a tarball you unpack and run, not an installer.
jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve version
        id: ver
        run: |
          TAG="${{ github.event.inputs.tag }}"; [ -z "$TAG" ] && TAG="${GITHUB_REF_NAME}"
          if [ "$TAG" = "main" ]; then TAG="nightly"; fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - name: Install libxml2
        run: |
          brew install libxml2 pkg-config
          echo "PKG_CONFIG_PATH=$(brew --prefix libxml2)/lib/pkgconfig" >> "$GITHUB_ENV"
      - name: Build
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --config Release
      - name: Self-test
        run: ctest --test-dir build --output-on-failure
      - name: Stage the zip
        run: |
          STAGE="restreamair-${{ steps.ver.outputs.tag }}-macos"
          mkdir -p "$STAGE"
          cp build/restreamair-server "$STAGE/restreamair"
          cp -R public "$STAGE/public"
          cp README.md SCRIPTING.md API.md EVENTS.md "$STAGE/"
          zip -qr "$STAGE.zip" "$STAGE"
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: restreamair-${{ steps.ver.outputs.tag }}-macos.zip
          if-no-files-found: error

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve version
        id: ver
        run: |
          TAG="${{ github.event.inputs.tag }}"; [ -z "$TAG" ] && TAG="${GITHUB_REF_NAME}"
          if [ "$TAG" = "main" ]; then TAG="nightly"; fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      # One statically linked musl executable: libcurl, libxml2, OpenSSL and
      # libc are all inside it, so nothing is resolved at runtime and no glibc
      # version is recorded. The previous ubuntu:22.04 build linked glibc 2.35
      # and died on anything older with `version GLIBC_2.34 not found`; building
      # against an even older glibc only moves that line, it does not remove it.
      - name: Build (Alpine, static musl)
        run: |
          docker run --rm -v "$PWD:/src" -w /src alpine:3.20 sh -c '
            set -e
            PKGS="build-base cmake pkgconf linux-headers
                  curl-dev curl-static libxml2-dev libxml2-static
                  openssl-dev openssl-libs-static zlib-dev zlib-static
                  xz-dev xz-static nghttp2-static brotli-static zstd-static
                  c-ares-static libidn2-static libunistring-static libpsl-static"
            # One transaction normally; if a package name has drifted in this
            # Alpine, fall back to per-package so the missing one is named
            # rather than taking the whole install down with it. The link step
            # is the real gate on whether the set was complete.
            apk add --no-cache $PKGS ||
              for p in $PKGS; do apk add --no-cache "$p" || echo "not in this Alpine: $p"; done
            cmake -S . -B build-release -DCMAKE_BUILD_TYPE=Release -DRS_STATIC=ON
            cmake --build build-release -j"$(nproc)"
            ./build-release/restream_selftest
          '
      # The claim the whole job rests on, checked rather than assumed: an ELF
      # with no DT_NEEDED entries asks the host for nothing.
      - name: The binary needs no shared libraries
        run: |
          file build-release/restreamair-server
          if readelf -d build-release/restreamair-server 2>/dev/null | grep -q NEEDED; then
            readelf -d build-release/restreamair-server | grep NEEDED
            echo "binary still depends on shared libraries"; exit 1
          fi
          echo "no shared library dependencies"
      - name: Stage the zip
        run: |
          STAGE="restreamair-${{ steps.ver.outputs.tag }}-linux-x86_64"
          mkdir -p "$STAGE"
          cp build-release/restreamair-server "$STAGE/restreamair"
          cp -R public "$STAGE/public"
          cp README.md SCRIPTING.md API.md EVENTS.md "$STAGE/"
          zip -qr "$STAGE.zip" "$STAGE"
          echo "STAGE=$STAGE" >> "$GITHUB_ENV"
      # Gold standard: run it on distros far older than the build host, with
      # nothing installed in them at all — no libcurl, no libxml2, no apt step.
      # ubuntu:18.04 is glibc 2.27 and debian:10 is 2.28, both well below the
      # 2.33 a user reported missing; alpine proves the musl-native case.
      - name: Runs untouched on old distros
        run: |
          for image in ubuntu:18.04 debian:10 alpine:3.18; do
            echo "== $image =="
            id=$(docker run -d --rm -v "$PWD/$STAGE:/app:ro" -p 8799:8799 "$image" \
                   /app/restreamair --port 8799 --bind 0.0.0.0 --root /app/public --no-download)
            sleep 5
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8799/ || echo none)
            ping=$(curl -s http://127.0.0.1:8799/ping || echo none)
            docker logs "$id" 2>&1 | tail -20
            docker stop "$id" >/dev/null
            [ "$code" = "200" ] || { echo "$image: panel returned $code"; exit 1; }
            echo "$image: panel serves the UI — OK ($ping)"
          done
      # The one thing a static build can plausibly get wrong: the TLS library is
      # now ours, and its compiled-in CA path is Alpine's. Started with no
      # public/ beside it, the panel bootstraps its front-end from GitHub over
      # HTTPS — so a panel that answers 200 here has verified a real
      # certificate chain against the host's trust store. See apps/server/net.c.
      - name: Verifies upstream HTTPS against the host trust store
        run: |
          mkdir -p bare && cp "$STAGE/restreamair" bare/
          id=$(docker run -d --rm -v "$PWD/bare:/app" -w /app -p 8798:8798 debian:12 \
                 sh -c 'apt-get update -qq && apt-get install -y -qq ca-certificates >/dev/null &&
                        exec /app/restreamair --port 8798 --bind 0.0.0.0')
          for i in $(seq 1 24); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8798/ || echo none)
            [ "$code" = "200" ] && break
            sleep 5
          done
          docker logs "$id" 2>&1 | tail -30
          docker stop "$id" >/dev/null
          [ "$code" = "200" ] || { echo "front-end bootstrap over HTTPS failed ($code)"; exit 1; }
          echo "downloaded public/ over TLS and served it: OK"
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: restreamair-${{ steps.ver.outputs.tag }}-linux-x86_64.zip
          if-no-files-found: error

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve version
        id: ver
        shell: bash
        run: |
          TAG="${{ github.event.inputs.tag }}"; [ -z "$TAG" ] && TAG="${GITHUB_REF_NAME}"
          if [ "$TAG" = "main" ]; then TAG="nightly"; fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      # libcurl and libxml2 come from vcpkg.json in a static triplet, together
      # with the static MSVC runtime. That is what makes the zip below a single
      # exe the user unpacks and runs, with nothing to install first — the same
      # deal the macOS and Linux tarballs give.
      - name: Cache vcpkg packages
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.VCPKG_INSTALLATION_ROOT }}/installed
            ${{ env.VCPKG_INSTALLATION_ROOT }}/packages
          key: vcpkg-x64-windows-static-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-x64-windows-static-
      - name: Build
        shell: bash
        run: |
          cmake -S . -B build-release \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET=x64-windows-static \
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build-release --config Release
      - name: Self-test
        run: ctest --test-dir build-release -C Release --output-on-failure
      - name: Stage the zip
        shell: bash
        run: |
          STAGE="restreamair-${{ steps.ver.outputs.tag }}-windows-x86_64"
          mkdir -p "$STAGE"
          cp build-release/Release/restreamair-server.exe "$STAGE/restreamair.exe"
          cp -R public "$STAGE/public"
          cp README.md SCRIPTING.md API.md EVENTS.md "$STAGE/"
          7z a "$STAGE.zip" "$STAGE" >/dev/null
          echo "STAGE=$STAGE" >> "$GITHUB_ENV"
      # The same gold-standard check the Linux job does: unpack it somewhere
      # clean and confirm the panel actually answers.
      - name: The unpacked panel serves the UI
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "$env:STAGE\restreamair.exe" `
                 -ArgumentList '--port','8799','--bind','127.0.0.1','--root',"$env:STAGE\public" -PassThru
          Start-Sleep -Seconds 5
          try {
            $r = Invoke-WebRequest -Uri http://127.0.0.1:8799/ -UseBasicParsing
            if ($r.StatusCode -ne 200) { throw "panel returned $($r.StatusCode)" }
            Invoke-WebRequest -Uri http://127.0.0.1:8799/ping -UseBasicParsing | Out-Null
            Write-Output "panel serves the UI from the unpacked zip: OK"
          } finally { Stop-Process -Id $p.Id -Force }
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: restreamair-${{ steps.ver.outputs.tag }}-windows-x86_64.zip
          if-no-files-found: error

  release:
    needs: [build-macos, build-linux, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Resolve tag
        id: ver
        run: |
          TAG="${{ github.event.inputs.tag }}"; [ -z "$TAG" ] && TAG="${GITHUB_REF_NAME}"
          if [ "$TAG" = "main" ]; then TAG="nightly"; fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with: { path: dist }
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ver.outputs.tag == 'nightly' && 'Nightly Build' || steps.ver.outputs.tag }}
          generate_release_notes: true
          prerelease: ${{ steps.ver.outputs.tag == 'nightly' }}
          files: dist/**/*
