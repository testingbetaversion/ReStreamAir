name: Release

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag to release, e.g. v1.0.0'
        required: true

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve version
        id: ver
        run: |
          TAG="${{ github.event.inputs.tag }}"; [ -z "$TAG" ] && TAG="${GITHUB_REF_NAME}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
      - name: Stamp version
        run: |
          sed -i '' "s/static let version = \"dev\"/static let version = \"${{ steps.ver.outputs.version }}\"/" Version.swift
          sed -i '' "s/static let commit = \"unknown\"/static let commit = \"${GITHUB_SHA:0:7}\"/" Version.swift
      - name: Embed web UI
        run: sh scripts/embed-assets.sh
      - run: swiftc -O $(ls *.swift | grep -vE 'MenuBarApp.swift|Package.swift') -o restreamair
      - run: swiftc -O HTTPClient.swift MenuBarApp.swift -o restreamair-menubar -framework AppKit
      - run: tar -czf restreamair-${{ steps.ver.outputs.tag }}-macos.tar.gz restreamair restreamair-menubar
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            restreamair
            restreamair-menubar
            restreamair-${{ steps.ver.outputs.tag }}-macos.tar.gz

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve version
        id: ver
        run: |
          TAG="${{ github.event.inputs.tag }}"; [ -z "$TAG" ] && TAG="${GITHUB_REF_NAME}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
      - name: Stamp version
        run: |
          COMMIT=$(echo "$GITHUB_SHA" | cut -c1-7)
          sed -i "s/static let version = \"dev\"/static let version = \"${{ steps.ver.outputs.version }}\"/" Version.swift
          sed -i "s/static let commit = \"unknown\"/static let commit = \"$COMMIT\"/" Version.swift
      # glibc + static Swift runtime → dynamically links system libcurl+OpenSSL
      # (so it trusts the host CA store and can fetch HTTPS, unlike a fully-static
      # musl build) while needing no Swift toolchain. Web UI is embedded, so the
      # binary needs no public/ directory on disk. We then bundle the versioned
      # libs (libxml2/ICU/lzma) whose sonames drift across Ubuntu releases, plus
      # a launcher, so a bare download runs on newer distros (e.g. 26.04 ships
      # libxml2.so.16, not the .so.2 the binary links) without installing anything.
      - name: Build + bundle self-contained tarball (embedded UI + libs + launcher)
        run: |
          STAGE="restreamair-${{ steps.ver.outputs.tag }}-linux-x86_64"
          docker run --rm -v "$PWD:/src" -w /src swift:6.0 bash -c "
            set -e
            sh scripts/embed-assets.sh
            swiftc -O -static-stdlib \$(ls *.swift | grep -vE 'MenuBarApp.swift|Package.swift') -o restreamair-linux
            sh scripts/bundle-linux.sh '$STAGE'
          "
          file restreamair-linux
          tar -czf "$STAGE.tar.gz" "$STAGE"
          echo "STAGE=$STAGE" >> "$GITHUB_ENV"
      - name: Verify no Swift runtime linked
        run: |
          if ldd restreamair-linux | grep -qi swift; then echo "links Swift runtime unexpectedly"; exit 1; fi
      - name: Verify the bundle runs on a host WITHOUT libxml2/ICU (the 26.04 failure mode)
        run: |
          docker run --rm -v "$PWD/$STAGE:/app:ro" ubuntu:24.04 bash -c '
            set -e
            # A real server has libcurl+OpenSSL (standard); the binary uses the
            # system copy so it trusts the host CA store. Install it first...
            apt-get update -qq && apt-get install -y -qq libcurl4 ca-certificates >/dev/null
            # ...then simulate a NEWER distro whose libxml2/ICU/lzma sonames
            # differ (Ubuntu 26.04 ships libxml2.so.16) by removing them, so the
            # ONLY way the binary loads those is via the bundled libs/.
            find / \( -name "libxml2.so.*" -o -name "libicu*.so.*" -o -name "liblzma.so.*" \) -delete 2>/dev/null || true
            echo "--- bare binary should FAIL to load libs ---"
            /app/restreamair-linux selftest 2>&1 | head -1 || echo "(bare binary failed, as expected)"
            echo "--- launcher should SUCCEED using bundled libs ---"
            /app/restreamair selftest
            /app/restreamair dash --info https://livesim2.dashif.org/livesim2/testpic_2s/Manifest.mpd | head -2
          '
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            restreamair-linux
            restreamair-${{ steps.ver.outputs.tag }}-linux-x86_64.tar.gz

  build-linux-arm64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve version
        id: ver
        run: |
          TAG="${{ github.event.inputs.tag }}"; [ -z "$TAG" ] && TAG="${GITHUB_REF_NAME}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
      - name: Stamp version
        run: |
          COMMIT=$(echo "$GITHUB_SHA" | cut -c1-7)
          sed -i "s/static let version = \"dev\"/static let version = \"${{ steps.ver.outputs.version }}\"/" Version.swift
          sed -i "s/static let commit = \"unknown\"/static let commit = \"$COMMIT\"/" Version.swift
      - uses: docker/setup-qemu-action@v3
      - name: Build + bundle self-contained tarball (arm64 emulation, embedded UI + libs + launcher)
        run: |
          STAGE="restreamair-${{ steps.ver.outputs.tag }}-linux-arm64"
          docker run --rm --platform linux/arm64 -v "$PWD:/src" -w /src swift:6.0 bash -c "
            set -e
            sh scripts/embed-assets.sh
            swiftc -O -static-stdlib \$(ls *.swift | grep -vE 'MenuBarApp.swift|Package.swift') -o restreamair-linux-arm64
            sh scripts/bundle-linux.sh '$STAGE' restreamair-linux-arm64
          "
          file restreamair-linux-arm64
          tar -czf "$STAGE.tar.gz" "$STAGE"
          echo "STAGE=$STAGE" >> "$GITHUB_ENV"
      - name: Verify bundle runs on a host WITHOUT libxml2/ICU (no Swift, no toolchain)
        run: |
          docker run --rm --platform linux/arm64 -v "$PWD/$STAGE:/app:ro" ubuntu:24.04 bash -c '
            set -e
            if ldd /app/restreamair-linux-arm64 | grep -qi swift; then echo "links Swift runtime unexpectedly"; exit 1; fi
            apt-get update -qq && apt-get install -y -qq libcurl4 >/dev/null
            find / \( -name "libxml2.so.*" -o -name "libicu*.so.*" -o -name "liblzma.so.*" \) -delete 2>/dev/null || true
            /app/restreamair selftest
          '
      - uses: actions/upload-artifact@v4
        with:
          name: linux-arm64
          path: |
            restreamair-linux-arm64
            restreamair-${{ steps.ver.outputs.tag }}-linux-arm64.tar.gz

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve version
        id: ver
        run: |
          $TAG = "${{ github.event.inputs.tag }}"
          if ([string]::IsNullOrWhiteSpace($TAG)) { $TAG = $env:GITHUB_REF_NAME }
          "tag=$TAG" >> $env:GITHUB_OUTPUT
          "version=$($TAG.TrimStart('v'))" >> $env:GITHUB_OUTPUT
      - name: Stamp version
        run: |
          $COMMIT = $env:GITHUB_SHA.Substring(0, 7)
          (Get-Content Version.swift) -replace 'static let version = "dev"', "static let version = `"${{ steps.ver.outputs.version }}`"" -replace 'static let commit = "unknown"', "static let commit = `"$COMMIT`"" | Set-Content Version.swift
      # 6.1.2 fixes the "cyclic dependency in module 'ucrt'" Swift 6.0 hit on the
      # MSVC that windows-latest now ships.
      - uses: compnerd/gha-setup-swift@main
        with:
          swift-version: "6.1.2"
          swift-build: "6.1.2-RELEASE"
      - name: Build restreamair (Windows x64)
        shell: pwsh
        run: |
          $STAGE = "restreamair-${{ steps.ver.outputs.tag }}-windows-x64"
          $sources = (Get-ChildItem *.swift |
            Where-Object { $_.Name -notmatch 'MenuBarApp\.swift|Package\.swift' }).Name
          swiftc -O $sources -o restreamair.exe
          Compress-Archive -Path restreamair.exe -DestinationPath "$STAGE.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            restreamair.exe
            restreamair-${{ steps.ver.outputs.tag }}-windows-x64.zip

  release:
    needs: [build-macos, build-linux, build-linux-arm64, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Resolve tag
        id: ver
        run: |
          TAG="${{ github.event.inputs.tag }}"; [ -z "$TAG" ] && TAG="${GITHUB_REF_NAME}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with: { path: dist }
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ver.outputs.tag }}
          generate_release_notes: true
          files: dist/**/*
