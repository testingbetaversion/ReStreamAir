name: Release

on:
  push:
    tags: [ 'v*' ]
    # Nightly releases on every push to main are DISABLED to save Actions
    # minutes — re-enable by uncommenting the line below. Tag pushes (v*) and
    # manual runs (workflow_dispatch) still cut a release.
    # branches: [ 'main' ]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag to release, e.g. v1.0.0'
        required: true

permissions:
  contents: write

# Every artifact is the same executable plus the public/ directory it serves.
# The panel resolves public/ relative to its working directory (or --root), so a
# release is a tarball you unpack and run, not an installer.
jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve version
        id: ver
        run: |
          TAG="${{ github.event.inputs.tag }}"; [ -z "$TAG" ] && TAG="${GITHUB_REF_NAME}"
          if [ "$TAG" = "main" ]; then TAG="nightly"; fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - name: Install libxml2
        run: |
          brew install libxml2 pkg-config
          echo "PKG_CONFIG_PATH=$(brew --prefix libxml2)/lib/pkgconfig" >> "$GITHUB_ENV"
      - name: Build
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --config Release
      - name: Self-test
        run: ctest --test-dir build --output-on-failure
      - name: Stage the tarball
        run: |
          STAGE="restreamair-${{ steps.ver.outputs.tag }}-macos"
          mkdir -p "$STAGE"
          cp build/restreamair-server "$STAGE/restreamair"
          cp -R public "$STAGE/public"
          tar -czf "$STAGE.tar.gz" "$STAGE"
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: restreamair-${{ steps.ver.outputs.tag }}-macos.tar.gz
          if-no-files-found: error

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve version
        id: ver
        run: |
          TAG="${{ github.event.inputs.tag }}"; [ -z "$TAG" ] && TAG="${GITHUB_REF_NAME}"
          if [ "$TAG" = "main" ]; then TAG="nightly"; fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      # Built inside ubuntu:22.04 rather than on the runner: glibc, libcurl and
      # libxml2 are resolved at runtime, and linking against the OLDEST glibc we
      # support is what makes the binary run on newer distros as well. The other
      # direction does not work.
      - name: Build (ubuntu:22.04 container)
        run: |
          docker run --rm -v "$PWD:/src" -w /src ubuntu:22.04 bash -c '
            set -e
            apt-get update -qq
            apt-get install -y -qq cmake build-essential libcurl4-openssl-dev libxml2-dev >/dev/null
            cmake -S . -B build-release -DCMAKE_BUILD_TYPE=Release
            cmake --build build-release -j"$(nproc)"
            ./build-release/restream_selftest
          '
      - name: Stage the tarball
        run: |
          STAGE="restreamair-${{ steps.ver.outputs.tag }}-linux-x86_64"
          mkdir -p "$STAGE"
          cp build-release/restreamair-server "$STAGE/restreamair"
          cp -R public "$STAGE/public"
          tar -czf "$STAGE.tar.gz" "$STAGE"
          echo "STAGE=$STAGE" >> "$GITHUB_ENV"
      # Gold standard: unpack on a bare Ubuntu carrying only the two runtime
      # libraries, and check the panel actually answers.
      - name: Runs on a bare Ubuntu with only libcurl + libxml2
        run: |
          docker run --rm -v "$PWD/$STAGE:/app:ro" ubuntu:24.04 bash -c '
            set -e
            apt-get update -qq && apt-get install -y -qq libcurl4 libxml2 ca-certificates curl >/dev/null
            cd /app
            ./restreamair --port 8799 --bind 127.0.0.1 --root /app/public &
            sleep 3
            test "$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8799/)" = "200"
            curl -fsS http://127.0.0.1:8799/ping
            echo "panel serves the UI on bare Ubuntu: OK"
          '
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: restreamair-${{ steps.ver.outputs.tag }}-linux-x86_64.tar.gz
          if-no-files-found: error

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve version
        id: ver
        shell: bash
        run: |
          TAG="${{ github.event.inputs.tag }}"; [ -z "$TAG" ] && TAG="${GITHUB_REF_NAME}"
          if [ "$TAG" = "main" ]; then TAG="nightly"; fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      # libcurl and libxml2 come from vcpkg.json in a static triplet, together
      # with the static MSVC runtime. That is what makes the zip below a single
      # exe the user unpacks and runs, with nothing to install first — the same
      # deal the macOS and Linux tarballs give.
      - name: Cache vcpkg packages
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.VCPKG_INSTALLATION_ROOT }}/installed
            ${{ env.VCPKG_INSTALLATION_ROOT }}/packages
          key: vcpkg-x64-windows-static-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-x64-windows-static-
      - name: Build
        shell: bash
        run: |
          cmake -S . -B build-release \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET=x64-windows-static \
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build-release --config Release
      - name: Self-test
        run: ctest --test-dir build-release -C Release --output-on-failure
      - name: Stage the zip
        shell: bash
        run: |
          STAGE="restreamair-${{ steps.ver.outputs.tag }}-windows-x86_64"
          mkdir -p "$STAGE"
          cp build-release/Release/restreamair-server.exe "$STAGE/restreamair.exe"
          cp -R public "$STAGE/public"
          7z a "$STAGE.zip" "$STAGE" >/dev/null
          echo "STAGE=$STAGE" >> "$GITHUB_ENV"
      # The same gold-standard check the Linux job does: unpack it somewhere
      # clean and confirm the panel actually answers.
      - name: The unpacked panel serves the UI
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "$env:STAGE\restreamair.exe" `
                 -ArgumentList '--port','8799','--bind','127.0.0.1','--root',"$env:STAGE\public" -PassThru
          Start-Sleep -Seconds 5
          try {
            $r = Invoke-WebRequest -Uri http://127.0.0.1:8799/ -UseBasicParsing
            if ($r.StatusCode -ne 200) { throw "panel returned $($r.StatusCode)" }
            Invoke-WebRequest -Uri http://127.0.0.1:8799/ping -UseBasicParsing | Out-Null
            Write-Output "panel serves the UI from the unpacked zip: OK"
          } finally { Stop-Process -Id $p.Id -Force }
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: restreamair-${{ steps.ver.outputs.tag }}-windows-x86_64.zip
          if-no-files-found: error

  release:
    needs: [build-macos, build-linux, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Resolve tag
        id: ver
        run: |
          TAG="${{ github.event.inputs.tag }}"; [ -z "$TAG" ] && TAG="${GITHUB_REF_NAME}"
          if [ "$TAG" = "main" ]; then TAG="nightly"; fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with: { path: dist }
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ver.outputs.tag == 'nightly' && 'Nightly Build' || steps.ver.outputs.tag }}
          generate_release_notes: true
          prerelease: ${{ steps.ver.outputs.tag == 'nightly' }}
          files: dist/**/*
