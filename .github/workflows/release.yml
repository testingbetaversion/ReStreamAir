name: Release

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag to release, e.g. v1.0.0'
        required: true

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve version
        id: ver
        run: |
          TAG="${{ github.event.inputs.tag }}"; [ -z "$TAG" ] && TAG="${GITHUB_REF_NAME}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
      - name: Stamp version
        run: |
          sed -i '' "s/static let version = \"dev\"/static let version = \"${{ steps.ver.outputs.version }}\"/" Version.swift
          sed -i '' "s/static let commit = \"unknown\"/static let commit = \"${GITHUB_SHA:0:7}\"/" Version.swift
      - run: swiftc -O $(ls *.swift | grep -v MenuBarApp.swift) -o restreamair
      - run: swiftc -O HTTPClient.swift MenuBarApp.swift -o restreamair-menubar -framework AppKit
      - run: tar -czf restreamair-${{ steps.ver.outputs.tag }}-macos.tar.gz restreamair restreamair-menubar
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            restreamair
            restreamair-menubar
            restreamair-${{ steps.ver.outputs.tag }}-macos.tar.gz

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve version
        id: ver
        run: |
          TAG="${{ github.event.inputs.tag }}"; [ -z "$TAG" ] && TAG="${GITHUB_REF_NAME}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
      - name: Stamp version
        run: |
          COMMIT=$(echo "$GITHUB_SHA" | cut -c1-7)
          sed -i "s/static let version = \"dev\"/static let version = \"${{ steps.ver.outputs.version }}\"/" Version.swift
          sed -i "s/static let commit = \"unknown\"/static let commit = \"$COMMIT\"/" Version.swift
      # Static Swift runtime → runs on any Linux without a toolchain.
      - name: Build (static)
        run: |
          docker run --rm -v "$PWD:/src" -w /src swift:6.0 \
            bash -c 'swiftc -O -static-stdlib $(ls *.swift | grep -v MenuBarApp.swift) -o restreamair-linux'
          file restreamair-linux
      - name: Verify self-contained (bare host, no Swift)
        run: |
          if ldd restreamair-linux | grep -qi swift; then echo "ERROR: links Swift runtime"; exit 1; fi
          ./restreamair-linux selftest
      - run: tar -czf restreamair-${{ steps.ver.outputs.tag }}-linux.tar.gz restreamair-linux
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            restreamair-linux
            restreamair-${{ steps.ver.outputs.tag }}-linux.tar.gz

  build-linux-arm64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve version
        id: ver
        run: |
          TAG="${{ github.event.inputs.tag }}"; [ -z "$TAG" ] && TAG="${GITHUB_REF_NAME}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
      - name: Stamp version
        run: |
          COMMIT=$(echo "$GITHUB_SHA" | cut -c1-7)
          sed -i "s/static let version = \"dev\"/static let version = \"${{ steps.ver.outputs.version }}\"/" Version.swift
          sed -i "s/static let commit = \"unknown\"/static let commit = \"$COMMIT\"/" Version.swift
      - uses: docker/setup-qemu-action@v3
      - name: Build (static, arm64 emulation)
        run: |
          docker run --rm --platform linux/arm64 -v "$PWD:/src" -w /src swift:6.0 \
            bash -c 'swiftc -O -static-stdlib $(ls *.swift | grep -v MenuBarApp.swift) -o restreamair-linux-arm64'
          file restreamair-linux-arm64
      - name: Verify self-contained (bare arm64 Ubuntu, no Swift)
        run: |
          docker run --rm --platform linux/arm64 -v "$PWD:/w" -w /w ubuntu:24.04 bash -c '
            apt-get update -qq && apt-get install -y -qq libcurl4 libxml2 >/dev/null
            if ldd restreamair-linux-arm64 | grep -qi swift; then echo "ERROR: links Swift runtime"; exit 1; fi
            ./restreamair-linux-arm64 selftest
          '
      - run: tar -czf restreamair-${{ steps.ver.outputs.tag }}-linux-arm64.tar.gz restreamair-linux-arm64
      - uses: actions/upload-artifact@v4
        with:
          name: linux-arm64
          path: |
            restreamair-linux-arm64
            restreamair-${{ steps.ver.outputs.tag }}-linux-arm64.tar.gz

  release:
    needs: [build-macos, build-linux, build-linux-arm64]
    runs-on: ubuntu-latest
    steps:
      - name: Resolve tag
        id: ver
        run: |
          TAG="${{ github.event.inputs.tag }}"; [ -z "$TAG" ] && TAG="${GITHUB_REF_NAME}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with: { path: dist }
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ver.outputs.tag }}
          generate_release_notes: true
          files: dist/**/*
